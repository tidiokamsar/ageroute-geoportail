server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Au-dela de la limite multer la plus haute (documents : 20 Mo) sinon Nginx
    # rejette l'upload en 413 avant meme qu'il n'atteigne le backend.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
