server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Au-dela de la limite multer la plus haute (documents : 20 Mo) sinon Nginx
    # rejette l'upload en 413 avant meme qu'il n'atteigne le backend.
    client_max_body_size 25m;

    # Le bundle partait a 152 Ko non compresses, vers un public majoritairement en 3G.
    # gzip_proxied any : les reponses passent par Traefik, qui ajoute des en-tetes de
    # proxy que Nginx interpreterait sinon comme une interdiction de compresser.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/geo+json image/svg+xml;

    # P3-B (§18) : en-tetes de sécurité du frontend statique — l'API en avait
    # (helmet) mais le frontend n'en envoyait aucun. CSP sans 'unsafe-inline'
    # serait idéal mais le bundle actuel emploie des styles inline (Tailwind +
    # composants) : style-src 'unsafe-inline' reste requis, script-src non.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # P3-B : la page d'embed (carte pour SharePoint) est la SEULE autorisée à
    # être encadrée, et uniquement par le domaine institutionnel. Tout le reste
    # du site reste non-encadrable (frame-ancestors 'none' ci-dessus).
    # Domaine SharePoint exact à confirmer par AGEROUTE — le masque
    # *.ageroute.gov.gn couvre le tenant institutionnel.
    location /embed/ {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self' data:; object-src 'none'; frame-ancestors 'self' https://*.ageroute.gov.gn" always;
    }

    # Les assets portent une empreinte dans leur nom (index-D1qFbNRm.js) : leur contenu
    # ne change jamais sans que le nom change, ils peuvent donc etre gardes un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais etre mis en cache, sinon un navigateur continuerait de
    # demander l'ancien bundle apres un deploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
